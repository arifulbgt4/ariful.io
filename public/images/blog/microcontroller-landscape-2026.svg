<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" role="img" aria-labelledby="svg-title svg-desc">
  <title id="svg-title">Microcontroller Landscape 2026</title>
  <desc id="svg-desc">Diagram grouping 2026 microcontroller families by entry-level, wireless, real-time control, edge AI, and automotive use cases.</desc>

  <defs>
    <radialGradient id="bg-glow" cx="50%" cy="45%" r="55%">
      <stop offset="0%" stop-color="#0f1729" />
      <stop offset="100%" stop-color="#070a0f" />
    </radialGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bg-glow)" />

  <!-- Technical grid -->
  <g stroke="#1a2744" stroke-width="0.5" opacity="0.5">
    <line x1="0" y1="105" x2="1200" y2="105" />
    <line x1="0" y1="210" x2="1200" y2="210" />
    <line x1="0" y1="315" x2="1200" y2="315" />
    <line x1="0" y1="420" x2="1200" y2="420" />
    <line x1="0" y1="525" x2="1200" y2="525" />
    <line x1="200" y1="0" x2="200" y2="630" />
    <line x1="400" y1="0" x2="400" y2="630" />
    <line x1="600" y1="0" x2="600" y2="630" />
    <line x1="800" y1="0" x2="800" y2="630" />
    <line x1="1000" y1="0" x2="1000" y2="630" />
  </g>

  <!-- Circuit traces -->
  <g stroke="#263244" stroke-width="1.5" fill="none" opacity="0.6">
    <path d="M200,315 L380,315" />
    <path d="M200,200 L300,200 L300,280 L380,280" />
    <path d="M200,430 L300,430 L300,350 L380,350" />
    <path d="M1000,315 L820,315" />
    <path d="M1000,200 L900,200 L900,280 L820,280" />
    <path d="M1000,430 L900,430 L900,350 L820,350" />
    <path d="M600,80 L600,240" />
    <path d="M420,120 L420,240 L520,240" />
    <path d="M780,120 L780,240 L680,240" />
    <path d="M420,500 L420,390 L520,390" />
    <path d="M780,500 L780,390 L680,390" />
    <path d="M340,180 L480,260" />
    <path d="M860,180 L720,260" />
    <path d="M340,450 L480,370" />
    <path d="M860,450 L720,370" />
  </g>

  <!-- Small trace dots -->
  <g fill="#3b82f6" opacity="0.4">
    <circle cx="200" cy="315" r="2" />
    <circle cx="1000" cy="315" r="2" />
    <circle cx="600" cy="80" r="2" />
    <circle cx="600" cy="550" r="2" />
    <circle cx="200" cy="200" r="2" />
    <circle cx="1000" cy="200" r="2" />
    <circle cx="200" cy="430" r="2" />
    <circle cx="1000" cy="430" r="2" />
  </g>

  <!-- Central MCU chip -->
  <g filter="url(#glow)">
    <rect x="510" y="255" width="180" height="120" rx="12" fill="#0c1524" stroke="#3b82f6" stroke-width="2" />
    <rect x="530" y="275" width="140" height="80" rx="6" fill="none" stroke="#1e3a5f" stroke-width="1" />
    <g fill="#3b82f6" opacity="0.7">
      <rect x="545" y="249" width="6" height="12" rx="1" />
      <rect x="565" y="249" width="6" height="12" rx="1" />
      <rect x="585" y="249" width="6" height="12" rx="1" />
      <rect x="605" y="249" width="6" height="12" rx="1" />
      <rect x="625" y="249" width="6" height="12" rx="1" />
      <rect x="645" y="249" width="6" height="12" rx="1" />
      <rect x="545" y="369" width="6" height="12" rx="1" />
      <rect x="565" y="369" width="6" height="12" rx="1" />
      <rect x="585" y="369" width="6" height="12" rx="1" />
      <rect x="605" y="369" width="6" height="12" rx="1" />
      <rect x="625" y="369" width="6" height="12" rx="1" />
      <rect x="645" y="369" width="6" height="12" rx="1" />
    </g>
    <text x="600" y="305" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="22" font-weight="800" fill="#67e8f9">MCU 2026</text>
    <text x="600" y="330" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#94a3b8">Families · Specs · Selection</text>
  </g>

  <!-- Node: Entry and General Control (top-left) -->
  <g>
    <rect x="80" y="130" width="240" height="100" rx="10" fill="#0c1524" stroke="#22d3ee" stroke-width="1.5" opacity="0.9" />
    <text x="200" y="165" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#22d3ee">Entry and General Control</text>
    <text x="200" y="190" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#94a3b8">8-bit · Cortex-M0+ · Cost</text>
    <text x="200" y="210" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#64748b">PIC · AVR · STM32C0 · MSPM0</text>
  </g>

  <!-- Node: Wireless and Matter (top-right) -->
  <g>
    <rect x="880" y="130" width="240" height="100" rx="10" fill="#0c1524" stroke="#a78bfa" stroke-width="1.5" opacity="0.9" />
    <text x="1000" y="165" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#a78bfa">Wireless and Matter</text>
    <text x="1000" y="190" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#94a3b8">Wi-Fi · Bluetooth LE · Thread</text>
    <text x="1000" y="210" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#64748b">ESP32 · nRF54L · EFR32MG26</text>
  </g>

  <!-- Node: Low Power and Security (bottom-left) -->
  <g>
    <rect x="80" y="400" width="240" height="100" rx="10" fill="#0c1524" stroke="#34d399" stroke-width="1.5" opacity="0.9" />
    <text x="200" y="435" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#34d399">Low Power and Security</text>
    <text x="200" y="460" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#94a3b8">TrustZone · Secure Boot · OTA</text>
    <text x="200" y="480" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#64748b">STM32U5 · RA · PSoC 6 · PIC32CM</text>
  </g>

  <!-- Node: Real-Time and Motor (bottom-right) -->
  <g>
    <rect x="880" y="400" width="240" height="100" rx="10" fill="#0c1524" stroke="#fb923c" stroke-width="1.5" opacity="0.9" />
    <text x="1000" y="435" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#fb923c">Real-Time and Motor</text>
    <text x="1000" y="460" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#94a3b8">CAN-FD · PWM · Control Loops</text>
    <text x="1000" y="480" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#64748b">C2000 · STM32G4 · dsPIC · XMC</text>
  </g>

  <!-- Node: Edge AI and HMI (top-center) -->
  <g>
    <rect x="450" y="60" width="300" height="100" rx="10" fill="#0c1524" stroke="#f472b6" stroke-width="1.5" opacity="0.9" />
    <text x="600" y="95" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="700" fill="#f472b6">Edge AI and HMI</text>
    <text x="600" y="120" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#94a3b8">NPU · Cortex-M85 · Graphics</text>
    <text x="600" y="140" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#64748b">RA8 · MCX N · STM32N6 · i.MX RT</text>
  </g>

  <!-- Secondary tech labels -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="9" fill="#475569">
    <text x="160" y="250" text-anchor="middle">8-bit</text>
    <text x="260" y="250" text-anchor="middle">Arm Cortex-M</text>
    <text x="380" y="180" text-anchor="middle">RISC-V</text>
    <text x="820" y="180" text-anchor="middle">RISC-V</text>
    <text x="940" y="250" text-anchor="middle">Wi-Fi</text>
    <text x="1060" y="250" text-anchor="middle">Bluetooth LE</text>
    <text x="940" y="520" text-anchor="middle">CAN-FD</text>
    <text x="1060" y="520" text-anchor="middle">Thread</text>
    <text x="600" y="510" text-anchor="middle">NPU</text>
    <text x="160" y="360" text-anchor="middle">RP2040</text>
    <text x="260" y="360" text-anchor="middle">RP2350</text>
    <text x="940" y="360" text-anchor="middle">ESP32-P4</text>
    <text x="1060" y="360" text-anchor="middle">Matter</text>
  </g>

  <!-- Footer -->
  <rect x="0" y="580" width="1200" height="50" fill="#070a0f" opacity="0.8" />
  <line x1="100" y1="580" x2="1100" y2="580" stroke="#1e3a5f" stroke-width="0.5" />
  <text x="600" y="610" text-anchor="middle" font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="12" font-weight="600" fill="#64748b" letter-spacing="0.15em">FAMILIES · SPECIFICATIONS · SELECTION TRADE-OFFS</text>
</svg>
